<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>Escola do Papai · Guia de Estudos</title>
<link rel="preload" as="image" href="https://htooiquctobyweffsydx.supabase.co/storage/v1/object/public/guias/boss-bg-1100.webp">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070b14;color:#f4c25b;font:600 15px Georgia,serif;text-align:center;letter-spacing:.08em}i{display:block;font-style:normal;font-size:34px;animation:s 1.6s linear infinite}@keyframes s{to{transform:rotate(360deg)}}button{margin-top:14px;font:600 15px sans-serif;padding:10px 18px;border:1px solid #f4c25b;background:none;color:#f4c25b;border-radius:10px}</style>
</head>
<body>
<div id="load"><i>✦</i>Abrindo o portal…</div>
<script>
(function(){
  var url='https://htooiquctobyweffsydx.supabase.co/storage/v1/object/public/guias/hub.html?v='+Date.now();
  fetch(url).then(function(r){if(!r.ok)throw new Error(r.status);return r.text();}).then(function(h){document.open();document.write(h);document.close();}).catch(function(){
    document.getElementById('load').innerHTML='Não consegui abrir o portal.<br>Confira sua internet.<br><button onclick="location.reload()">Tentar de novo</button>';
  });
})();
</script>
</body>
</html>
