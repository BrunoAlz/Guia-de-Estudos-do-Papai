<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4a5424">
<title>Roteiro da 2ª Guerra Mundial</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#ddd5bf;color:#211e17;font:16px Georgia,serif;text-align:center;padding:16px;box-sizing:border-box}b{display:block;font:700 22px 'Arial Narrow',Impact,sans-serif;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}button{margin-top:14px;font:600 15px sans-serif;padding:10px 18px;border:2px solid #211e17;background:#4a5424;color:#f1ead6;border-radius:3px}</style>
</head>
<body>
<div id="load"><b>Carregando o guia…</b>Preparando a missão, soldado.</div>
<script>
(function(){
  var url='https://htooiquctobyweffsydx.supabase.co/storage/v1/object/public/guias/2gm.html?v='+Date.now();
  fetch(url).then(function(r){if(!r.ok)throw new Error(r.status);return r.text();}).then(function(h){document.open();document.write(h);document.close();}).catch(function(){
    document.getElementById('load').innerHTML='<b>Não consegui carregar o guia</b>Confira sua internet e tente de novo.<br><button onclick="location.reload()">Tentar de novo</button>';
  });
})();
</script>
</body>
</html>
